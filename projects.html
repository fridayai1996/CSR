<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <title>Priority CSR Projects Directory | Sri Sathya Sai District, Govt of AP</title>
    <meta content="width=device-width, initial-scale=1.0" name="viewport">
    <meta content="Sri Sathya Sai District Priority Projects Directory, CSR Investment Opportunities, Andhra Pradesh, Penukonda, Puttaparthi" name="description">

    <!-- Favicon -->
    <link href="img/csr_logo.png" rel="icon" type="image/png">
    <link rel="canonical" href="https://www.srisathyasaicsr.com/projects.html">

    <!-- Google Web Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bai+Jamjuree:wght@400;500;600;700&family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

    <!-- Icon Font Stylesheet -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">

    <!-- Vendor CSS via CDN -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Bespoke Design Tokens & Stylesheets -->
    <link href="css/tokens.css" rel="stylesheet">
    <link href="css/base.css" rel="stylesheet">
    <link href="style.css" rel="stylesheet">
    <link href="css/premium.css" rel="stylesheet">
    <link href="css/ui21.css?v=20260901d" rel="stylesheet">
</head>

<body>
    <!-- Skip to main content for accessibility -->
    <a class="skip-link" href="#main-content">Skip to main content</a>

    <!-- Header Component Start -->
    <div id="site-header"></div>
    <!-- Header Component End -->

    <!-- Hero Title Header -->
    <header id="main-content" class="hero-banner text-center" role="banner">
        <div class="container">
            <h1 class="display-4 mx-auto fw-bold" data-i18n="nav_projects">Priority Projects Directory</h1>
            <p class="hero-lede mx-auto">Pre-cleared civic and rural development projects open for corporate adoption.</p>
            <div class="d-flex justify-content-center align-items-center gap-3 flex-wrap">
                <a href="#directory" class="btn btn-primary rounded-pill px-4 py-2 fw-bold btn-shine text-nowrap">
                    Explore Sectors
                </a>
                <a href="index.html#partner-form" class="btn btn-outline-light rounded-pill px-4 py-2 fw-bold text-nowrap">
                    Submit General EOI
                </a>
            </div>
        </div>
    </header>

    <!-- Main Directory Content -->
    <main id="directory" class="container py-5" role="main">
        <!-- Interactive Filter Toolbar -->
        <section class="partner-card mb-5" aria-label="Filter Priority Projects">
            <div class="d-flex justify-content-between align-items-center flex-wrap gap-2 mb-3">
                <div class="d-flex align-items-center gap-2">
                    <span class="text-primary fs-5" aria-hidden="true"><i class="bi bi-sliders"></i></span>
                    <h2 class="h5 fw-bold mb-0 text-dark">Filter Pre-Cleared Projects</h2>
                </div>
                <span id="results-count" class="badge bg-light text-dark border px-3 py-2 fw-semibold">
                    Showing 12 Projects
                </span>
            </div>

            <div class="row g-3">
                <div class="col-lg-4 col-md-6">
                    <label for="search-input" class="form-label small">Search Keywords</label>
                    <input type="text" id="search-input" class="form-control" placeholder="Search title, mandal, keywords..." aria-label="Search projects by keyword">
                </div>
                <div class="col-lg-4 col-md-6">
                    <label for="sector-filter" class="form-label small">Schedule VII Sector</label>
                    <select id="sector-filter" class="form-select" aria-label="Filter by Schedule VII focus sector">
                        <option value="All">All 12 Schedule VII Sectors</option>
                        <option value="Healthcare & Sanitation">Healthcare &amp; Sanitation (Item i)</option>
                        <option value="Smart Education & Skills">Smart Education &amp; Skills (Item ii)</option>
                        <option value="Gender Equality & Women Care">Gender Equality &amp; Women Care (Item iii)</option>
                        <option value="Environmental Sustainability">Environmental Sustainability (Item iv)</option>
                        <option value="Heritage & Culture">Heritage &amp; Culture (Item v)</option>
                        <option value="Armed Forces & Veteran Welfare">Armed Forces &amp; Veteran Welfare (Item vi)</option>
                        <option value="Rural & Olympic Sports">Rural &amp; Olympic Sports (Item vii)</option>
                        <option value="Socio-Economic Welfare Funds">Socio-Economic Welfare Funds (Item viii)</option>
                        <option value="Incubators, R&D & SDGs">Incubators, R&amp;D &amp; SDGs (Item ix)</option>
                        <option value="Rural Development Projects">Rural Development Projects (Item x)</option>
                        <option value="Slum Area Development">Slum Area Development (Item xi)</option>
                        <option value="Disaster Management">Disaster Management (Item xii)</option>
                    </select>
                </div>
                <div class="col-lg-3 col-md-6">
                    <label for="mandal-filter" class="form-label small">Mandal / Division</label>
                    <select id="mandal-filter" class="form-select" aria-label="Filter by Mandal or Revenue Division">
                        <option value="All">All 32 Mandals</option>
                        <option value="Penukonda">Penukonda Division</option>
                        <option value="Puttaparthi">Puttaparthi Division</option>
                        <option value="Hindupur">Hindupur Division</option>
                        <option value="Dharmavaram">Dharmavaram Division</option>
                        <option value="Kadiri">Kadiri Division</option>
                        <option value="Madakasira">Madakasira Division</option>
                    </select>
                </div>
                <div class="col-lg-1 col-md-6 d-flex align-items-end">
                    <button class="btn btn-outline-secondary w-100 fw-bold py-2" onclick="resetFilters()" title="Reset All Filters">
                        <i class="bi bi-arrow-counterclockwise" aria-hidden="true"></i><span class="visually-hidden">Reset</span>
                    </button>
                </div>
            </div>
        </section>

        <!-- Project Cards Grid -->
        <div class="row g-4" id="project-grid-container" aria-live="polite">
            <!-- Dynamic project cards rendered via renderProjectCards -->
        </div>
    </main>

    <!-- Footer Start -->
    <div id="site-footer"></div>
    <!-- Footer End -->

    <!-- Back to top button -->
    <a href="#main-content" class="btn btn-primary rounded-circle btn-lg-square back-to-top" aria-label="Back to top">
        <i class="bi bi-arrow-up" aria-hidden="true"></i>
    </a>

    <!-- JS Libraries -->
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="js/i18n.js"></script>
    <script src="js/pdf-generator.js"></script>
    <script src="js/csr-client.js"></script>
    <script src="js/csr-api.js"></script>
    <script src="main.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.13.0/dist/gsap.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.13.0/dist/ScrollTrigger.min.js"></script>
    <script src="js/premium-motion.js?v=20260901d"></script>

    <script>
        const sampleProjects = [
            {
                id: "proj-701",
                title: "Safe RO Water Hubs & Child Nutrition Program",
                mandal: "Kadiri",
                sector: "Healthcare & Sanitation",
                budget: "₹1.50 Crores",
                sponsor: "KIA Motors India Foundation",
                status: "In Progress",
                progressPct: 75,
                description: "Schedule VII (i): Eradicating hunger & malnutrition, establishing 15 community RO water purification plants in fluorosis habitations."
            },
            {
                id: "proj-702",
                title: "EV Technician Vocational Skill Center & Smart Schools",
                mandal: "Penukonda",
                sector: "Smart Education & Skills",
                budget: "₹2.00 Crores",
                sponsor: "Tata Trusts Foundation",
                status: "In Progress",
                progressPct: 70,
                description: "Schedule VII (ii): Vocational skill enhancement for EV technicians, special education, and digital interactive classrooms across ZP schools."
            },
            {
                id: "proj-703",
                title: "Working Women Hostels & Senior Citizen Daycare Homes",
                mandal: "Dharmavaram",
                sector: "Gender Equality & Women Care",
                budget: "₹1.20 Crores",
                sponsor: "L&T Construction CSR",
                status: "Under Review",
                progressPct: 25,
                description: "Schedule VII (iii): Safe residential hostels for women weavers, senior citizen daycare centers, and reducing socio-economic inequalities."
            },
            {
                id: "proj-704",
                title: "Soil/Water Conservation & Solar Micro-Grid Network",
                mandal: "NP Kunta",
                sector: "Environmental Sustainability",
                budget: "₹1.80 Crores",
                sponsor: "BHEL Corporate CSR",
                status: "Under Review",
                progressPct: 15,
                description: "Schedule VII (iv): Agroforestry, soil & water conservation, animal welfare, and solar micro-grids for PHCs and Gram Panchayats."
            },
            {
                id: "proj-705",
                title: "Lepakshi Heritage Restoration & E-Library Network",
                mandal: "Lepakshi",
                sector: "Heritage & Culture",
                budget: "₹85 Lakhs",
                sponsor: "Open for Corporate Adoption",
                status: "Proposed",
                progressPct: 0,
                description: "Schedule VII (v): Restoration of historical sites at Penukonda & Lepakshi, public e-libraries, and traditional handicraft artisan support."
            },
            {
                id: "proj-706",
                title: "Armed Forces Veterans & War Widows Welfare Cell",
                mandal: "Puttaparthi",
                sector: "Armed Forces & Veteran Welfare",
                budget: "₹50 Lakhs",
                sponsor: "Open for Corporate Adoption",
                status: "Proposed",
                progressPct: 0,
                description: "Schedule VII (vi): Healthcare, vocational retraining, and education scholarships for CAPF/CPMF veterans, ex-servicemen, and war widows."
            },
            {
                id: "proj-707",
                title: "Rural Sports Training Complex & Paralympic Coaching",
                mandal: "Dharmavaram",
                sector: "Rural & Olympic Sports",
                budget: "₹75 Lakhs",
                sponsor: "Open for Corporate Adoption",
                status: "Proposed",
                progressPct: 0,
                description: "Schedule VII (vii): Multi-purpose sports grounds, paralympic coaching camps, and equipment for nationally recognized rural sports."
            },
            {
                id: "proj-708",
                title: "SC/ST & Vulnerable Communities Welfare Infrastructure",
                mandal: "Madakasira",
                sector: "Socio-Economic Welfare Funds",
                budget: "₹1.10 Crores",
                sponsor: "Open for Corporate Adoption",
                status: "Proposed",
                progressPct: 0,
                description: "Schedule VII (viii): Targeted socio-economic development, community halls, and welfare amenities for Scheduled Castes, STs, and OBC habitations."
            },
            {
                id: "proj-709",
                title: "AgTech Incubator & IIT/CSIR SDG Research Center",
                mandal: "Puttaparthi",
                sector: "Incubators, R&D & SDGs",
                budget: "₹2.50 Crores",
                sponsor: "Open for Corporate Adoption",
                status: "Proposed",
                progressPct: 0,
                description: "Schedule VII (ix): Technology incubators and research grants for Sustainable Development Goals (SDGs) in partnership with IITs and CSIR labs."
            },
            {
                id: "proj-710",
                title: "All-Weather Mandal Connectivity & Solar Street Lights",
                mandal: "Hindupur",
                sector: "Rural Development Projects",
                budget: "₹3.00 Crores",
                sponsor: "Open for Corporate Adoption",
                status: "Proposed",
                progressPct: 0,
                description: "Schedule VII (x): All-weather rural roads, drainage networks, solar street lighting, and Gram Panchayat civic infrastructure."
            },
            {
                id: "proj-711",
                title: "Municipal Slum Area Housing & Underground Drainage",
                mandal: "Kadiri",
                sector: "Slum Area Development",
                budget: "₹1.40 Crores",
                sponsor: "Open for Corporate Adoption",
                status: "Proposed",
                progressPct: 0,
                description: "Schedule VII (xi): Upgrading sanitation, drinking water pipelines, underground drainage, and civic facilities in declared urban slums."
            },
            {
                id: "proj-712",
                title: "Drought Resilience Check-Dams & Cyclone Shelter Network",
                mandal: "Bukkapatnam",
                sector: "Disaster Management",
                budget: "₹1.60 Crores",
                sponsor: "Open for Corporate Adoption",
                status: "Proposed",
                progressPct: 0,
                description: "Schedule VII (xii): Rainwater check-dams, cyclone shelters, emergency response kits, and post-disaster reconstruction infrastructure."
            }
        ];

        function renderProjectCards(list) {
            const container = document.getElementById("project-grid-container");
            const countBadge = document.getElementById("results-count");
            if (!container) return;

            if (countBadge) {
                countBadge.textContent = `Showing ${list.length} of ${sampleProjects.length} Projects`;
            }

            if (list.length === 0) {
                container.innerHTML = `
                    <div class="col-12 text-center py-5">
                        <i class="bi bi-search display-4 text-muted mb-3 d-block" aria-hidden="true"></i>
                        <h3 class="h5 fw-bold">No projects found matching your criteria</h3>
                        <p class="text-muted">Try adjusting your keyword search or sector filters.</p>
                        <button class="btn btn-outline-primary rounded-pill mt-3 px-4" onclick="resetFilters()">Reset All Filters</button>
                    </div>
                `;
                return;
            }

            container.innerHTML = list.map(p => `
                <div class="col-xl-4 col-lg-6 col-md-6 col-12">
                    <article class="project-card p-4 h-100 d-flex flex-column" aria-labelledby="title-${p.id}">
                        <div class="d-flex justify-content-between align-items-center mb-2">
                            <span class="badge bg-light text-primary border">${p.sector}</span>
                            <span class="badge bg-light text-dark border"><i class="bi bi-geo-alt-fill text-primary me-1" aria-hidden="true"></i>${p.mandal}</span>
                        </div>
                        <h3 id="title-${p.id}" class="h5 fw-bold text-dark mt-2 mb-2">${p.title}</h3>
                        <p class="text-muted small mb-3 flex-grow-1">${p.description}</p>
                        
                        <div class="p-3 bg-light rounded-3 mb-3 border">
                            <div class="d-flex justify-content-between mb-1">
                                <span class="small text-muted fw-semibold">Target Outlay:</span>
                                <span class="fw-bold text-success num">${p.budget}</span>
                            </div>
                            <div class="d-flex justify-content-between">
                                <span class="small text-muted fw-semibold">Status:</span>
                                <span class="small fw-bold text-dark">${p.sponsor}</span>
                            </div>
                            ${p.progressPct > 0 ? `
                                <div class="progress mt-2" style="height: 6px;">
                                    <div class="progress-bar bg-success" role="progressbar" style="width: ${p.progressPct}%;" aria-valuenow="${p.progressPct}" aria-valuemin="0" aria-valuemax="100"></div>
                                </div>
                            ` : ''}
                        </div>

                        <div class="d-flex gap-2 mt-auto">
                            <button class="btn btn-sm btn-outline-primary w-50 fw-bold rounded-pill" data-project-id="${p.id}" onclick="downloadProjectPDF(sampleProjects.find(x=>x.id==='${p.id}'))">
                                <i class="bi bi-file-earmark-pdf me-1" aria-hidden="true"></i> PDF Brief
                            </button>
                            <a href="index.html?sector=${encodeURIComponent(p.sector)}&project=${encodeURIComponent(p.title)}#partner-form" class="btn btn-sm btn-primary w-50 fw-bold rounded-pill btn-shine">
                                <i class="bi bi-heart-fill me-1" aria-hidden="true"></i> Adopt
                            </a>
                        </div>
                    </article>
                </div>
            `).join('');
        }

        function filterProjects() {
            const query = (document.getElementById("search-input").value || "").toLowerCase().trim();
            const sector = document.getElementById("sector-filter").value;
            const mandal = document.getElementById("mandal-filter").value;

            const filtered = sampleProjects.filter(p => {
                const matchQuery = !query || p.title.toLowerCase().includes(query) || p.description.toLowerCase().includes(query) || p.mandal.toLowerCase().includes(query);
                const matchSector = (sector === "All") || (p.sector === sector);
                const matchMandal = (mandal === "All") || (p.mandal === mandal);
                return matchQuery && matchSector && matchMandal;
            });

            renderProjectCards(filtered);
            if (typeof window.ui21Enhance === "function") window.ui21Enhance();
        }

        function resetFilters() {
            document.getElementById("search-input").value = "";
            document.getElementById("sector-filter").value = "All";
            document.getElementById("mandal-filter").value = "All";
            renderProjectCards(sampleProjects);
            if (typeof window.ui21Enhance === "function") window.ui21Enhance();
        }

        document.addEventListener("DOMContentLoaded", () => {
            renderProjectCards(sampleProjects);
            if (typeof window.ui21Enhance === "function") window.ui21Enhance();
            document.getElementById("search-input").addEventListener("input", filterProjects);
            document.getElementById("sector-filter").addEventListener("change", filterProjects);
            document.getElementById("mandal-filter").addEventListener("change", filterProjects);
        });
    </script>
</body>

</html>
